<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kairu Admin — Login</title>
    <link rel="stylesheet" href="/css/00-global.css" />
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body class="admin-body login-page">
    <main class="login-shell">
      <section class="login-panel" aria-labelledby="loginTitle">
        <img class="login-logo" src="/assets/logo.svg" alt="Kairu Arquitetura" />
        <p class="admin-eyebrow">Painel administrativo</p>
        <h1 id="loginTitle">Acesso das donas do projeto</h1>
        <p class="login-copy">
          Entre para atualizar imagens da hero e do portfólio sem mexer nos
          arquivos do site.
        </p>

        <form id="loginForm" class="admin-form">
          <label>
            Usuário
            <input name="username" type="text" autocomplete="username" required />
          </label>
          <label>
            Senha
            <input
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </label>
          <button type="submit">Entrar</button>
          <p id="loginMessage" class="form-message" role="status"></p>
        </form>
      </section>
    </main>

    <script src="/admin/login.js"></script>
  </body>
</html>
